<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiger Voucher System - Secure Sync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap');
        body { font-family: 'Sarabun', sans-serif; overflow-x: hidden; }
        
        @media print {
            @page { margin: 0; size: portrait; }
            html, body { width: 80mm; background: white !important; margin: 0 !important; padding: 0 !important; }
            .no-print { display: none !important; }
            #preview-ui { display: block !important; background: white !important; padding: 0 !important; margin: 0 !important; width: 100% !important; height: auto !important; }
            .page-break { display: block; page-break-after: always; height: 0; margin: 0; border: none; }
            .receipt-container { width: 74mm !important; box-shadow: none !important; margin: 0 auto !important; padding: 5mm 2mm !important; border: none !important; display: block !important; }
            h1, h2, h3, span, p, div { color: black !important; }
        }
        
        .receipt-container { width: 72mm; background: white; padding: 10px 8px; font-size: 14px; line-height: 1.3; color: black; margin: 0 auto 20px auto; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .dotted-line { border-top: 1px dashed black; margin: 8px 0; }
        .text-center { text-align: center; }
        .flex-between { display: flex; justify-content: space-between; align-items: flex-start; }
        .total-customer { font-size: 38px; font-weight: bold; line-height: 1; margin: 5px 0; text-align: center; }
        .animate-slide-in { animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { transform: translateX(-10px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .total-box { border: 2px solid black; padding: 10px 15px; display: inline-block; border-radius: 0; background: transparent; margin: 10px 0; width: auto; }
        .label-width { min-width: 70px; display: inline-block; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- UI หลัก -->
    <div id="main-ui" class="max-w-md mx-auto p-4 no-print">
        <header class="text-center mb-4">
            <h1 class="text-2xl font-bold text-orange-600">Tiger Voucher</h1>
            <p class="text-gray-500 text-sm italic">Secure Mode (PDF Format)</p>
        </header>

        <div id="staff-section" class="bg-white p-4 rounded-xl shadow-sm border-2 border-orange-200 mb-4 transition-all">
            <div class="flex items-center justify-between mb-2">
                <label class="text-sm font-bold text-gray-700">1. สแกน QR ชื่อพนักงาน</label>
            </div>
            <input type="text" id="staff-input" autofocus autocomplete="off"
                   placeholder="แสกนป้ายชื่อพนักงาน..." 
                   class="w-full border-2 border-gray-200 p-4 rounded-lg bg-orange-50 focus:border-orange-500 outline-none text-center text-lg font-bold">
            <div id="staff-display" class="mt-3 p-3 bg-green-100 text-green-700 rounded-lg font-bold text-center hidden">
                ✅ พนักงาน: <span id="current-staff"></span>
            </div>
        </div>

        <div id="voucher-section" class="bg-white p-4 rounded-xl shadow-sm border-2 border-gray-100 mb-4 opacity-30 pointer-events-none transition-all">
            <div class="flex items-center justify-between mb-2">
                <label class="text-sm font-bold text-gray-700">2. สแกน QR Voucher (1-3 ใบ)</label>
            </div>
            <input type="text" id="voucher-input" autocomplete="off"
                   placeholder="แสกนคูปอง..." 
                   class="w-full border-2 border-gray-200 p-4 rounded-lg focus:border-blue-500 outline-none text-center text-lg font-bold">
            
            <div id="scan-msg" class="text-center text-sm mt-3 font-bold min-h-[1.5rem] transition-all"></div>
            <ul id="voucher-list" class="mt-4 space-y-2"></ul>
            
            <div id="fast-hint" class="mt-4 p-3 bg-blue-50 border border-blue-100 rounded-lg text-center hidden">
                <p class="text-blue-600 text-sm">💡 แสกน <span class="font-bold underline text-blue-800">ชื่อพนักงานอีกครั้ง</span> เพื่อพิมพ์</p>
            </div>
        </div>

        <button id="btn-combine" disabled
                class="w-full bg-gray-300 text-white py-5 rounded-2xl font-bold text-xl shadow-lg transform active:scale-95 transition-all">
            ยืนยันและสร้างใบเสร็จ
        </button>
        
        <p class="text-center text-gray-400 text-xs mt-6">รูปแบบใบเสร็จอ้างอิงตาม PDF (Direct Sync)</p>
    </div>

    <!-- UI แสดงตัวอย่างใบเสร็จ -->
    <div id="preview-ui" class="hidden min-h-screen py-6 bg-gray-900">
        <div class="max-w-md mx-auto px-4">
            <div id="receipt-view">
                <div id="receipt-content"></div>
            </div>
            <div class="mt-6 space-y-3 no-print">
                <button onclick="window.print()" class="w-full bg-green-500 hover:bg-green-600 text-white py-4 rounded-xl font-bold text-xl shadow-xl">
                    🖨️ พิมพ์ใบเสร็จ (ตัดอัตโนมัติ)
                </button>
                <button onclick="location.reload()" class="w-full bg-white/10 text-white py-4 rounded-xl font-bold text-lg border border-white/20">
                    🔄 เริ่มรายการใหม่
                </button>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzmEMwaY9tpUC3EwNjr-5llxanwtciHkHaYlvtR9vv8lkOuaq6fg-FekdVhdtkfYk0/exec";
        
        let state = {
            staff: "",
            vouchers: [],
            isProcessing: false
        };

        const staffInput = document.getElementById('staff-input');
        const voucherInput = document.getElementById('voucher-input');
        const btnCombine = document.getElementById('btn-combine');
        const scanMsg = document.getElementById('scan-msg');

        staffInput.addEventListener('change', (e) => {
            const val = e.target.value.trim();
            if (val !== "") {
                state.staff = val;
                document.getElementById('current-staff').innerText = val;
                document.getElementById('staff-display').classList.remove('hidden');
                document.getElementById('staff-input').style.display = 'none';
                document.getElementById('voucher-section').classList.remove('opacity-30', 'pointer-events-none');
                voucherInput.focus();
                showMsg("พร้อมแสกนคูปอง", "text-green-500");
            }
        });

        voucherInput.addEventListener('change', (e) => {
            const code = e.target.value.trim();
            if (code === "" || state.isProcessing) return;

            if (code === state.staff) {
                if (state.vouchers.length > 0) processSendData();
                else showMsg("⚠️ กรุณาแสกนคูปองก่อน", "text-red-500");
                e.target.value = "";
                return;
            }

            if (state.vouchers.length >= 3) {
                showMsg("⚠️ เต็ม 3 ใบแล้ว", "text-red-500");
            } else if (state.vouchers.includes(code)) {
                showMsg("❌ แสกนไปแล้ว", "text-red-500");
            } else {
                state.vouchers.push(code);
                updateVoucherList();
                showMsg(`✅ เพิ่มใบที่ ${state.vouchers.length} สำเร็จ`, "text-green-600");
            }
            e.target.value = "";
            checkReady();
        });

        function updateVoucherList() {
            const list = document.getElementById('voucher-list');
            list.innerHTML = state.vouchers.map((v, i) => `
                <li class="flex justify-between items-center bg-blue-50 p-2 rounded-lg border border-blue-100 animate-slide-in">
                    <span class="font-bold text-blue-800 text-sm">${i+1}. 🎫 ${v}</span>
                    <button onclick="removeVoucher(${i})" class="text-red-500 px-2 font-bold text-xs">ลบ</button>
                </li>
            `).join('');
            document.getElementById('fast-hint').classList.toggle('hidden', state.vouchers.length === 0);
        }

        window.removeVoucher = function(index) {
            if(state.isProcessing) return;
            state.vouchers.splice(index, 1);
            updateVoucherList();
            checkReady();
            voucherInput.focus();
        };

        function checkReady() {
            const isReady = state.staff && state.vouchers.length > 0;
            btnCombine.disabled = !isReady;
            btnCombine.className = `w-full py-5 rounded-2xl font-bold text-xl shadow-lg transform active:scale-95 transition-all ${isReady ? 'bg-orange-500 text-white' : 'bg-gray-300 text-white'}`;
        }

        btnCombine.addEventListener('click', processSendData);

        async function processSendData() {
            if (state.isProcessing) return;
            state.isProcessing = true;
            
            showMsg("⏳ กำลังประมวลผลระบบ Tiger...", "text-orange-500");
            btnCombine.innerText = "⏳ กำลังส่งข้อมูล...";
            btnCombine.classList.replace('bg-orange-500', 'bg-gray-400');
            voucherInput.disabled = true;
            
            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        staff_name: state.staff,
                        vouchers: state.vouchers.map(v => ({ code: v }))
                    })
                });

                const result = await response.json();
                if (result.status === "SUCCESS") {
                    generateReceipt(result);
                    document.getElementById('main-ui').classList.add('hidden');
                    document.getElementById('preview-ui').classList.remove('hidden');
                } else {
                    showMsg("❌ " + result.message, "text-red-600");
                    resetButton();
                }
            } catch (err) {
                showMsg("❌ การเชื่อมต่อล้มเหลว", "text-red-600");
                resetButton();
            } finally {
                voucherInput.disabled = false;
            }
        }

        function resetButton() {
            state.isProcessing = false;
            btnCombine.innerText = "ยืนยันและสร้างใบเสร็จ";
            btnCombine.classList.replace('bg-gray-400', 'bg-orange-500');
            checkReady();
        }

        function generateReceipt(data) {
            const now = new Date().toLocaleString('th-TH', { dateStyle: 'short', timeStyle: 'short' });
            const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(data.new_voucher)}`;
            const txId = data.transaction_id || `TX-${new Date().getTime()}`;
            
            const storeItemsHtml = data.vouchers_detail.map(v => `
                <div class="flex-between">
                    <span>${v.code}</span>
                    <span>${parseFloat(v.amount).toFixed(2)}.-</span>
                </div>
            `).join('');
            
            const customerItemsHtml = data.vouchers_detail.map((v, idx) => `
                <div class="flex-between">
                    <span>บิลใบที่ ${idx+1}</span>
                    <span>${parseFloat(v.amount).toFixed(2)}</span>
                </div>
            `).join('');
            
            const totalAmount = parseFloat(data.total_amount).toFixed(2);
            
            const storeReceipt = `
                <div class="receipt-container">
                    <div style="font-size: 13px;">
                        <div class="flex-between"><span>พนักงาน:</span><span>${escapeHtml(state.staff)}</span></div>
                        <div class="flex-between"><span>ธุรกรรม:</span><span>${txId}</span></div>
                        <div class="flex-between"><span>เวลา:</span><span>${now}</span></div>
                    </div>
                    <div class="text-center" style="margin: 15px 0;">
                        <img src="${qrUrl}" alt="QR" style="width: 100px; height: 100px; margin: 0 auto;">
                        <p class="font-bold" style="margin-top: 8px; font-size: 16px;">${escapeHtml(data.new_voucher)}</p>
                    </div>
                    <div class="dotted-line"></div>
                    <div class="font-bold" style="margin-bottom: 5px;">รายการคูปองที่ใช้:</div>
                    <div style="font-size: 13px;">${storeItemsHtml}</div>
                    <div class="dotted-line"></div>
                    <div class="flex-between font-bold" style="font-size: 16px;">
                        <span>รวมทั้งสิ้น</span>
                        <span>${totalAmount}.-</span>
                    </div>
                </div>
            `;
            
            const customerReceipt = `
                <div class="receipt-container">
                    <div style="font-size: 13px;">
                        <div class="flex-between"><span>ธุรกรรม:</span><span>${txId}</span></div>
                        <div class="flex-between"><span>เวลา:</span><span>${now}</span></div>
                    </div>
                    <div class="text-center font-bold" style="margin: 15px 0; font-size: 20px;">เอกสารรวมเงิน</div>
                    <div class="dotted-line"></div>
                    <div style="font-size: 15px;">${customerItemsHtml}</div>
                    <div class="dotted-line"></div>
                    <div class="text-center" style="margin-top: 10px;">
                        <p class="font-bold" style="font-size: 15px;">ยอดรวมเงินทั้งสิ้น</p>
                        <div class="total-box">
                            <span class="total-customer">${totalAmount}</span> <span style="font-size: 18px;">บาท</span>
                        </div>
                    </div>
                    <div class="text-center font-bold" style="margin-top: 10px; font-size: 16px;">
                        ${escapeHtml(data.new_voucher)}
                    </div>
                    <div class="text-center" style="margin-top: 10px; font-size: 13px;">
                        ขอบคุณที่ใช้บริการ
                    </div>
                </div>
            `;
            
            document.getElementById('receipt-content').innerHTML = storeReceipt + `<div class="page-break"></div>` + customerReceipt;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
        }

        function showMsg(text, colorClass) {
            scanMsg.innerText = text;
            scanMsg.className = `text-center text-sm mt-3 font-bold min-h-[1.5rem] ${colorClass}`;
        }
    </script>
</body>
</html>
